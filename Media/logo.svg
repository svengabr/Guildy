<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2b2f3a"/><stop offset="1" stop-color="#12141a"/>
    </radialGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c5fa8"/><stop offset=".6" stop-color="#1b3f78"/><stop offset="1" stop-color="#0e2348"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8"/><stop offset=".55" stop-color="#e8b53a"/><stop offset="1" stop-color="#a8741a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d27e"/><stop offset=".5" stop-color="#8a5a2b"/><stop offset="1" stop-color="#e2b56a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3dc"/><stop offset="1" stop-color="#e2cf9f"/>
    </linearGradient>
    <radialGradient id="glow" r="50%">
      <stop offset="0" stop-color="#ffd76a" stop-opacity=".35"/><stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shieldClip">
      <path d="M256 92 C 316 112 362 116 398 112 C 400 250 360 360 256 430 C 152 360 112 250 114 112 C 150 116 196 112 256 92 Z"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="72" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="64" fill="none" stroke="#c9a45c" stroke-opacity=".55" stroke-width="4"/>
  <ellipse cx="256" cy="458" rx="150" ry="14" fill="#000" opacity=".35"/>
  <circle cx="256" cy="250" r="190" fill="url(#glow)"/>

  <!-- shield: gold rim, blue field -->
  <path d="M256 74 C 322 96 372 100 414 94 C 418 262 372 384 256 456 C 140 384 94 262 98 94 C 140 100 190 96 256 74 Z"
        fill="url(#rim)" stroke="#2a1708" stroke-width="5" stroke-linejoin="round"/>
  <path d="M256 92 C 316 112 362 116 398 112 C 400 250 360 360 256 430 C 152 360 112 250 114 112 C 150 116 196 112 256 92 Z"
        fill="url(#field)" stroke="#2a1708" stroke-width="4" stroke-linejoin="round"/>
  <g clip-path="url(#shieldClip)">
    <!-- light sweep on the field -->
    <path d="M114 112 L 256 92 L 256 430 L 114 330 Z" fill="#ffffff" opacity=".06"/>
    <!-- chevron band -->
    <path d="M100 300 L 256 210 L 412 300 L 412 336 L 256 246 L 100 336 Z" fill="url(#gold)" opacity=".9"/>
  </g>

  <!-- three members: two behind, one in front (gold) -->
  <g fill="url(#gold)" stroke="#2a1708" stroke-width="4" stroke-linejoin="round">
    <circle cx="186" cy="176" r="26"/>
    <path d="M140 262 C 140 222 160 206 186 206 C 212 206 232 222 232 262 Z"/>
    <circle cx="326" cy="176" r="26"/>
    <path d="M280 262 C 280 222 300 206 326 206 C 352 206 372 222 372 262 Z"/>
    <circle cx="256" cy="168" r="34"/>
    <path d="M196 290 C 196 236 222 210 256 210 C 290 210 316 236 316 290 Z"/>
  </g>

  <!-- speech bubble: chat first -->
  <g transform="translate(300 300)">
    <path d="M14 0 H 150 C 166 0 176 10 176 26 V 88 C 176 104 166 114 150 114 H 76 L 40 146 L 46 114 H 14 C -2 114 -12 104 -12 88 V 26 C -12 10 -2 0 14 0 Z"
          fill="url(#paper)" stroke="#2a1708" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="44" cy="57" r="11" fill="#7a5320"/>
    <circle cx="82" cy="57" r="11" fill="#7a5320"/>
    <circle cx="120" cy="57" r="11" fill="#7a5320"/>
  </g>
</svg>
